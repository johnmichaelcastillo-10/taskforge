name: Desktop installers

# Builds the Windows (.msi, .exe) and Linux (.deb, .AppImage) installers. Run it by hand from
# the Actions tab, or push a tag such as v1.0.0 to also publish them as a draft release.
# The installers open the site in the repository variable TASKFORGE_URL (Settings → Secrets and
# variables → Actions → Variables), such as https://taskforge.example.com.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on older systems too.
            os: ubuntu-22.04
            bundles: deb,appimage
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Linux libraries (WebKitGTK, tray, SVG icons, keyboard shortcuts)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - run: npm ci
      - name: Point the app at the site
        run: npm run configure
        env:
          TASKFORGE_URL: ${{ vars.TASKFORGE_URL }}
      - name: Build
        run: npx tauri build --config src-tauri/tauri.site.conf.json --bundles ${{ matrix.bundles }}

      # Each installer must install on a clean machine and the app must keep running once started.
      - name: Install the MSI and start the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', 'install.log' -Wait
          $exe = Get-ChildItem "$env:ProgramFiles\Taskforge" -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-Content install.log -Tail 40; throw 'The MSI did not install the app.' }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "The app exited after starting (code $($app.ExitCode))." }
          Stop-Process -Id $app.Id
          "Installed and running: $($exe.FullName)"
      - name: Install the .deb and start the app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb xvfb
          code=0
          xvfb-run -a timeout 20 taskforge-desktop || code=$?
          echo "exit code $code (124 = still running after 20 seconds)"
          test "$code" = 124

      - uses: actions/upload-artifact@v7
        with:
          name: taskforge-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      # The artifacts arrive in one folder per format (msi/, nsis/, deb/, appimage/).
      - name: Create a draft release with the installers (or update it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find installers -type f)
          echo "$files"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --repo "$GITHUB_REPOSITORY" --draft --title "Taskforge $GITHUB_REF_NAME" \
              --notes "Desktop installers for Windows (.msi, .exe) and Linux (.deb, .AppImage)."
          fi
