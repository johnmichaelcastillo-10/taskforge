[package]
name = "taskforge-desktop"
version = "0.1.0"
description = "Taskforge for Windows and Linux: the hosted app in a native window, with the timer in the tray"
edition = "2021"
license = "UNLICENSED"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small installers: the shell does little work, so size matters more than speed.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
